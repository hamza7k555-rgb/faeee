<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYSTEM HACKED</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Share Tech Mono', monospace; cursor: crosshair; }
        body { background-color: #000; color: #00ff41; overflow: hidden; height: 100vh; width: 100vw; }

        /* خلفية الأرقام المتساقطة */
        #canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; opacity: 0.15; }

        /* شاشة إدخال الـ IP */
        #inputScreen {
            position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: rgba(0,0,0,0.85);
        }
        #inputScreen h1 { color: #ff3333; font-size: 28px; margin-bottom: 20px; text-shadow: 0 0 15px #ff3333; text-align: center; letter-spacing: 2px;}
        #inputScreen input {
            padding: 15px; width: 85%; max-width: 400px; background: #000; border: 1px solid #00ff41; color: #00ff41;
            font-size: 18px; text-align: center; outline: none; margin-bottom: 20px; direction: ltr; border-radius: 5px; font-family: monospace;
        }
        #inputScreen input:focus { box-shadow: 0 0 15px rgba(0, 255, 65, 0.5); }
        #inputScreen button {
            padding: 15px 40px; background: #000; border: 1px solid #00ff41; color: #00ff41;
            font-size: 18px; font-weight: bold; cursor: pointer; border-radius: 5px; transition: 0.3s; text-transform: uppercase;
        }
        #inputScreen button:hover { background: #00ff41; color: #000; box-shadow: 0 0 20px #00ff41; }

        /* الشاشة اللي فيها الكلام */
        .terminal { position: relative; z-index: 1; padding: 20px; font-size: 16px; line-height: 1.6; height: 100%; overflow-y: auto; text-shadow: 0 0 5px rgba(0, 255, 65, 0.7); display: none; }
        .top-bar { display: flex; justify-content: space-between; border-bottom: 1px solid #00ff41; padding-bottom: 10px; margin-bottom: 20px; font-size: 14px; background: rgba(0, 0, 0, 0.8); position: sticky; top: 0; padding: 10px 0; z-index: 10;}
        .top-bar span { animation: blink 2s infinite; }
        @keyframes blink { 50% { opacity: 0; } }

        .cmd { color: #fff; font-weight: bold; }
        .warn { color: #ffcc00; }
        .danger { color: #ff3333; text-shadow: 0 0 10px #ff3333; }
        .success { color: #00ff41; }

        .box { border: 1px solid #00ff41; padding: 15px; margin: 15px 0; background: rgba(0, 20, 0, 0.8); box-shadow: 0 0 15px rgba(0, 255, 65, 0.2) inset; }
        .box.danger-box { border-color: #ff3333; box-shadow: 0 0 15px rgba(255, 51, 51, 0.2) inset; }

        .progress-bar-container { width: 100%; height: 20px; background: #111; border: 1px solid #00ff41; margin: 10px 0; position: relative; }
        .progress-bar { width: 0%; height: 100%; background: #00ff41; transition: width 0.1s linear; }
        .progress-text { position: absolute; top: 0; left: 0; width: 100%; text-align: center; font-size: 12px; color: #000; font-weight: bold; line-height: 18px; }
    </style>
</head>
<body>

    <!-- خلفية الماتريكس -->
    <canvas id="canvas"></canvas>

    <!-- شاشة الإدخال الأولى -->
    <div id="inputScreen">
        <h1>INITIATE CYBER ATTACK</h1>
        <input type="text" id="ipInput" placeholder="ENTER TARGET IP (e.g. 192.168.1.1)" dir="ltr">
        <button onclick="startHack()">EXECUTE</button>
    </div>

    <!-- شاشة العرض السينمائي -->
    <div class="terminal" id="terminal">
        <div class="top-bar">
            <span id="ipDisplay">TARGET: UNKNOWN</span>
            <span class="danger" id="timer">TIME: 00:30</span>
        </div>
        <div id="output"></div>
    </div>

    <script>
        // ================= 1. خلفية الماتريكس =================
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const letters = '10101010101111010101010010010100111010101010101';
        const fontSize = 16;
        const columns = canvas.width / fontSize;
        const drops = [];
        for (let x = 0; x < columns; x++) drops[x] = 1;

        function drawMatrix() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#00ff41';
            ctx.font = fontSize + 'px monospace';
            for (let i = 0; i < drops.length; i++) {
                const text = letters.charAt(Math.floor(Math.random() * letters.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 33);

        // ================= 2. السيناريو =================
        let targetIP = '';
        const output = document.getElementById('output');

        function typeText(element, text, className) {
            return new Promise(resolve => {
                const span = document.createElement('div');
                if (className) span.className = className;
                element.appendChild(span);
                let i = 0;
                function type() {
                    if (i < text.length) {
                        span.innerHTML += text.charAt(i);
                        i++;
                        setTimeout(type, 10); // سرعة الكتابة
                    } else {
                        span.innerHTML += '<br>';
                        window.scrollTo(0, document.body.scrollHeight);
                        resolve();
                    }
                }
                type();
            });
        }

        async function startHack() {
            targetIP = document.getElementById('ipInput').value.trim();
            if (!targetIP) return alert('أدخل الـ IP أولاً يا بطل!');

            document.getElementById('inputScreen').style.display = 'none';
            document.getElementById('terminal').style.display = 'block';
            document.getElementById('ipDisplay').innerText = `TARGET: ${targetIP}`;

            // المؤقت
            let timeLeft = 30;
            const timerElement = document.getElementById('timer');
            const timerInterval = setInterval(() => {
                timeLeft--;
                timerElement.innerText = `TIME: 00:${timeLeft < 10 ? '0' + timeLeft : timeLeft}`;
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    timerElement.innerText = `TIME: 00:00`;
                }
            }, 1000);

            const scriptSteps = [
                { text: `[~] Starting NMAP scan on ${targetIP}...`, class: 'cmd', delay: 1000 },
                { text: `[+] Port 21 (FTP) - OPEN`, class: 'success', delay: 400 },
                { text: `[+] Port 22 (SSH) - OPEN`, class: 'success', delay: 400 },
                { text: `[+] Port 80 (HTTP) - OPEN`, class: 'success', delay: 400 },
                { text: `[+] Port 443 (HTTPS) - OPEN`, class: 'success', delay: 400 },
                { text: `[!] Detecting OS Fingerprint...`, class: 'warn', delay: 1000 },
                { text: `[!] OS: Windows 11 Pro (Build 22621)`, class: 'warn', delay: 800 },
                { text: `[~] Bypassing Firewall & IDS...`, class: 'cmd', delay: 1500 },
                { text: `[✓] Firewall bypassed successfully.`, class: 'success', delay: 600 },
                { text: `[~] Exploiting CVE-2023-38408 (Zero-Day)...`, class: 'danger', delay: 2000 },
                { text: `[✓] Root shell access acquired.`, class: 'success', delay: 800 },
                { text: `[~] Extracting SAM & SYSTEM hives...`, class: 'cmd', delay: 1200 },
                { text: `[✓] Password hashes extracted.`, class: 'success', delay: 800 },
                { text: `[~] Uploading payload (ransom.exe)...`, class: 'cmd', delay: 1500 },
                { text: `[!] Encrypting user files (AES-256)...`, class: 'danger', delay: 1500 },
                { text: `[~] Erasing event logs...`, class: 'cmd', delay: 1000 },
                { text: `[!] CONNECTION CLOSED.`, class: 'danger', delay: 800 }
            ];

            for (const step of scriptSteps) {
                await new Promise(r => setTimeout(r, step.delay));
                await typeText(output, step.text, step.class);
            }

            // شريط التحميل
            await new Promise(r => setTimeout(r, 800));
            const progressBox = document.createElement('div');
            progressBox.className = 'box danger-box';
            progressBox.innerHTML = `
                <div style="color: #ff3333; margin-bottom: 10px; font-weight: bold;">DOWNLOADING STOLEN DATA...</div>
                <div class="progress-bar-container">
                    <div class="progress-bar" id="dlBar"></div>
                    <div class="progress-text" id="dlText">0%</div>
                </div>
                <div style="font-size: 12px; color: #888; margin-top: 10px;">File: users_database.sql (4.2 GB)</div>
            `;
            output.appendChild(progressBox);
            window.scrollTo(0, document.body.scrollHeight);

            let progress = 0;
            const dlInterval = setInterval(() => {
                progress += Math.floor(Math.random() * 8) + 2;
                if (progress > 100) progress = 100;
                document.getElementById('dlBar').style.width = progress + '%';
                document.getElementById('dlText').innerText = progress + '%';
                
                if (progress === 100) {
                    clearInterval(dlInterval);
                    document.getElementById('dlText').innerText = 'DONE ✓';
                    setTimeout(showFinalMessage, 1000);
                }
            }, 80);
        }

        // ================= 3. النهاية والإشعار =================
        function showFinalMessage() {
            const finalBox = document.createElement('div');
            finalBox.className = 'box';
            finalBox.style.textAlign = 'center';
            finalBox.style.marginTop = '30px';
            finalBox.innerHTML = `
                <h1 style="color: #ff3333; text-shadow: 0 0 20px #ff3333; font-size: 30px; margin-bottom: 15px;">ACCESS GRANTED</h1>
                <p style="color: #00ff41; font-size: 16px;">System fully compromised.</p>
                <p style="color: #ff3333; font-size: 14px; margin-top: 20px; animation: blink 1s infinite;">DISCONNECTING FROM HOST...</p>
            `;
            output.appendChild(finalBox);
            window.scrollTo(0, document.body.scrollHeight);
            
            // جلب الـ Chat ID
            const urlParams = new URLSearchParams(window.location.search);
            const userChatId = urlParams.get('chatid') || window.Telegram?.WebApp?.initDataUnsafe?.user?.id;

            // إرسال الإشعار للسيرفر
            if (userChatId) {
                fetch('/.netlify/functions/notify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chatId: userChatId, ip: targetIP })
                }).catch(e => console.log("Fetch error:", e));
            }

            // شاشة الموت وقفل الصفحة
            setTimeout(() => {
                document.body.style.background = '#000';
                document.getElementById('terminal').innerHTML = '<h1 style="text-align:center; margin-top:40vh; font-size:40px; color: #ff0000; text-shadow: 0 0 30px #ff0000;">SYSTEM CRASHED</h1>';
                
                // محاولة قفل الصفحة
                setTimeout(() => { 
                    window.close(); 
                }, 2000);
            }, 2000);
        }
    </script>
</body>
</html>
